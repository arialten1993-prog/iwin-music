<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iWiN</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

body {
    cursor: pointer;
    user-select: none;
}
</style>
</head>

<body>

<audio id="music" loop preload="auto">
    <source src="iWiN主题曲.MP3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("music");

document.body.addEventListener("click", function () {
    music.play();
}, { once: true });
</script>

</body>
</html>
